<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>OmniRelay — AI Inference Gateway</title>
    <script>
      /* Resolve the theme before first paint so there is no flash of the wrong
         color scheme. Same key and fallback order as src/stores/theme.ts. */
      (function () {
        var mode = null;
        try {
          var stored = localStorage.getItem("omnirelay.theme");
          if (stored === "light" || stored === "dark") mode = stored;
        } catch (e) {
          /* storage unavailable — use the system preference */
        }
        var dark = mode ? mode === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
